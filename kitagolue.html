const cnv=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
let mousx=0;
let mousy=0;
let page=1;
let curr="";
let box=0;
let npp=48;
let cpage=[];
const lp=Math.ceil(objs.length/npp);
//ripped straight from apgacha 
function drawobj(apg,size,startx,starty){
    ctx.fillStyle="white";
    if (apg[0] != "m" && apg[0] != "y"){
	    let code = apg.split("_")[1];
		let x=startx;
		let y=starty;
		for (let i=0; i<code.length; i++){
		    let bin=parseInt(code[i],36).toString(2).padStart(5,"0");
			switch (bin){
			    case "100000":
                    x+=10*size;
					break;
			    case "100001":
			        x+=15*size;
					break;
				case "100010":
				    x+=(20+(5*parseInt(code[i+1],36)))*size;
					i++;
					break;
			    case "100011":
			        x=startx;
			        y+=25*size;
					break;
			    default:
			        for (let j=0; j<bin.length+1; j++){
			            if (bin[5-j]==="1"){
				            ctx.fillRect(x,y+5*j*size-5,5*size,5*size);
				        }
			        }
		            x+=5*size;
			}
		}
	}
}
cnv.addEventListener("mousemove", function(e){
    const rect=canvas.getBoundingClientRect();
	mousx=e.clientX-rect.left;
	mousy=e.clientY-rect.top;
	const boxn=(8*Math.floor(mousy/90)+Math.floor(mousx/90));
	if (mousy>=1&&mousy<=539){
		if (page===lp){
			if (boxn>cpage.length-1){
				box=cpage.length-1;
			}else{
				box=boxn;
			}
		}else{
			box=boxn;
		}
	}
});
document.addEventListener("keydown",function(e){
	const key=e.key;
	if (key==="ArrowRight" || key==="d" || key==="D"){
		if (page<=lp-1){
			page+=1;
			if (page===lp){
				box=objs.length-(npp*Math.floor(objs.length/npp))-1
			}
		}
	} else if (key==="ArrowLeft" || key==="a" || key==="A"){
		if (page>=2){
			page-=1;
		}
	}
});
cnv.addEventListener("click", function(e){
	window.location.href="https://catagolue.hatsya.com/object/"+(cpage[box])+"/b3s23";
});
function draw(){
	ctx.fillStyle="black";
	ctx.fillRect(0,0,cnv.width,cnv.height);
	ctx.fillStyle="#7f0000";
	ctx.fillRect((box%8)*90,Math.floor(box/8)*90,90,90);
	let curx=0;
	let cury=0;
	cpage=objs.slice(npp*(page-1),npp*page);
	cpage.forEach((h)=>{
		drawobj(h,1,curx,cury);
		curx+=90;
		if (curx>=720){
			cury+=90;
			curx=0;
		}
	});
	ctx.font="12pt Consolas";
	ctx.fillText(page+"/"+lp, 655, 555);
	ctx.fillText(cpage[box].slice(0,2)==="xs" ? cpage[box] : curr+cpage[box], 0, 555);
	ctx.fillText(1+box+npp*(page-1), 350, 555);
    requestAnimationFrame(draw);
}
function init(){
	let curr="";
	objs.forEach((i)=>{
		    if (i.slice(0,2)==="xs"){
				curr=i.slice(0,5);
			}else{
				objs[objs.indexOf(i)]=curr+i;
			}
	});
}
init();
draw();
